[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pobot"
version = "0.1.0"
description = "Research pipeline for evaluating whether a binary-options edge exists before risking capital"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "duckdb>=0.9",
    "scipy>=1.10",
    "websockets>=11.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
pobot = "pobot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
